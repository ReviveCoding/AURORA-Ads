[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-ads"
version = "1.0.0"
description = "Evidence-controlled research for reliable agentic advertising systems"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Jinwoo Bae" }
]
keywords = [
  "agentic-ai",
  "advertising",
  "calibration",
  "causal-inference",
  "delayed-conversion",
  "model-risk",
  "off-policy-evaluation",
  "reproducibility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyarrow>=15",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "joblib>=1.3"
]

[project.optional-dependencies]
dev = [
  "duckdb>=1.0",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "pytest>=8.0",
  "ruff>=0.6",
  "torch>=2.4",
  "transformers>=4.48",
  "mcp>=1.9"
]

[project.urls]
Homepage = "https://github.com/ReviveCoding/AURORA-Ads"
Repository = "https://github.com/ReviveCoding/AURORA-Ads"
Documentation = "https://github.com/ReviveCoding/AURORA-Ads/tree/main/docs"
Changelog = "https://github.com/ReviveCoding/AURORA-Ads/blob/main/CHANGELOG.md"
Issues = "https://github.com/ReviveCoding/AURORA-Ads/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
